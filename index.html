

<!DOCTYPE html>
<html>
<head>
    <title>Appointment Booking App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Appointment Booking</h2>

    <form id="appointmentForm" class="card p-4 mb-4">
        <input type="text" id="username" class="form-control mb-3"
               placeholder="Enter Name" required>

        <input type="email" id="email" class="form-control mb-3"
               placeholder="Enter Email" required>

        <input type="tel" id="phone" class="form-control mb-3"
               placeholder="Enter Phone Number" required>

        <button type="submit" id="submitBtn" class="btn btn-primary">
            Add Appointment
        </button>
    </form>

    <h4>Appointments</h4>
    <ul id="appointmentList" class="list-group"></ul>

    <p id="message" class="mt-3"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="index.js"></script>
</body>
</html>
